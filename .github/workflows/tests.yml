name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weeknights: catches drift in two third-party systems we do not control.
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
    inputs:
      profile:
        description: Which profile to run
        type: choice
        default: full
        options: [smoke, regression, full]

jobs:
  traceability:
    name: traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Traceability is only worth claiming if something checks it. A requirement with
      # no case, or a test whose case id is not in the plan, fails the build here.
      - run: python tools/traceability.py --check

  ui:
    name: UI suite (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the suite
        run: |
          case "${{ github.event.inputs.profile || 'full' }}" in
            smoke)      npx playwright test --grep @smoke ;;
            regression) npx playwright test --grep @P1 ;;
            *)          npx playwright test ;;
          esac
      - name: Upload the report and the evidence it captured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  api:
    name: API suite (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ReqRes allows 40 requests a day from one address without an account. A key
      # lifts that; without one the suite skips rather than fails, so a missing secret
      # never turns a third party's limit into a red build.
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY || 'reqres-free-v1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: python -m pip install -r requirements.txt
      - name: Run the suite
        run: |
          case "${{ github.event.inputs.profile || 'full' }}" in
            smoke)      pytest tests/api -m smoke ;;
            regression) pytest tests/api -m P1 ;;
            *)          pytest tests/api ;;
          esac
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.html
          retention-days: 14
